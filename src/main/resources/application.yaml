spring:
  application:
    name: vuln-severity-evaulator
  profiles:
    # Running with no arguments runs locally: deterministic model, in memory database, no credentials needed.
    default: local
  jpa:
    open-in-view: false
  ai:
    # The application only consumes ChatModel. The OpenAI starter otherwise attempts to create every supported
    # model type when its selector is absent; audio, image, embedding and moderation would require credentials
    # even for the deterministic local profile.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  web:
    error:
      include-stacktrace: never
      include-message: never

app:
  cache:
    catalog:
      ttl: 1h
      maximum-size: 128
    evaluation:
      ttl: 5m
      maximum-size: 10000
---
# All runnable profiles need the same scoring specification and context catalog. H2 is an ephemeral
# challenge fixture; deploying this service requires a durable database and versioned migrations.
spring:
  config:
    activate:
      on-profile: "local | production-openai | production-grok"
  datasource:
    url: jdbc:h2:mem:evaluations;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: embedded
      data-locations: classpath:sql/data.sql
  jpa:
    # The seed has to run after Hibernate creates the schema, not before it.
    defer-datasource-initialization: true
    hibernate:
      # The challenge fixture is ephemeral; see docs/guide/architecture/data-model.md for deployment requirements.
      ddl-auto: create-drop
---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console
